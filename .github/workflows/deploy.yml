name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Read the repo; the deploy job additionally gets `pages: write` + `id-token: write`.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Resolves the absolute deployment URL the sitemap integration needs:
      # a `PUBLIC_BASE_URL` variable that already is a full URL (custom domain)
      # counts as the URL; a bare sub-path is the GitHub Pages project site
      # (`https://<owner>.github.io/<repo>/`); an empty value is the domain root.
      # src/utils/base.ts keeps the base path logic; this only feeds the
      # sitemap and robots.txt, never page links.
      - name: Resolve deployment URL
        run: |
          case "$PUBLIC_BASE_URL" in
            http*) echo "PUBLIC_SITE_URL=$PUBLIC_BASE_URL" >> "$GITHUB_ENV" ;;
            "") echo "PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/" >> "$GITHUB_ENV" ;;
            *) echo "PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${PUBLIC_BASE_URL}/" >> "$GITHUB_ENV" ;;
          esac
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}

      - name: Build
        run: pnpm build
        env:
          # A repository variable named PUBLIC_BASE_URL holds the deployment
          # sub-path. A project site on GitHub Pages is served from
          # `https://<owner>.github.io/<repo>/`, so that is the repo name.
          # Leave it empty (or use a full URL such as a custom domain) for a
          # site served from the domain root. See src/utils/base.ts.
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          # Optional explicit sitemap host override. Keep this unset here:
          # setting an empty repository variable would mask the PUBLIC_SITE_URL
          # resolved in the previous step. The resolver already handles the
          # GitHub Pages URL and custom domains configured via PUBLIC_BASE_URL.
          # PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      # GitHub Pages serves exactly this artifact at the deployment base.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-github-pages:
    needs: [build]
    runs-on: ubuntu-latest
    # !IMPORTANT: The `github-pages` environment only admits refs its deployment
    # branch rules allow, and that takes precedence over the `on: push` filter
    # above. Keeping this on `main` means the two agree.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

