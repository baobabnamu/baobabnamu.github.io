name: Notion Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lets the script skip Notion pages that haven't changed since the last
      # run. Best-effort: a cache miss just makes this run scan every page,
      # same as before this existed.
      - name: Restore Notion sync state
        uses: actions/cache/restore@v4
        with:
          path: .cache/notion-sync-state.json
          key: notion-sync-state-${{ github.run_id }}
          restore-keys: |
            notion-sync-state-

      - name: Sync from Notion
        run: pnpm notion:sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Save Notion sync state
        uses: actions/cache/save@v4
        with:
          path: .cache/notion-sync-state.json
          key: notion-sync-state-${{ github.run_id }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/post
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "content: sync from Notion"
          git push
