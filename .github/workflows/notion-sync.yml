name: Notion Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch Test below.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lets the script skip Notion pages that haven't changed since the last
      # run. Best-effort: a cache miss just makes this run scan every page,
      # same as before this existed.
      - name: Restore Notion sync state
        uses: actions/cache/restore@v4
        with:
          path: .cache/notion-sync-state.json
          key: notion-sync-state-${{ github.run_id }}
          restore-keys: |
            notion-sync-state-

      - name: Sync from Notion
        run: pnpm notion:sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Save Notion sync state
        uses: actions/cache/save@v4
        with:
          path: .cache/notion-sync-state.json
          key: notion-sync-state-${{ github.run_id }}

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/post
          if git diff --cached --quiet; then
            echo "No content changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "content: sync from Notion"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push doesn't fire `on: push` (GitHub suppresses that to
      # avoid infinite loops), so Test → Deploy would never run on their own
      # after the push above. Dispatching Test directly sidesteps that — but
      # Deploy's own `workflow_run: [Test]` trigger turned out to be
      # unreliable for runs that were themselves started via workflow_dispatch
      # (observed: fired once, silently didn't on an otherwise identical next
      # run), so this waits for Test to finish and dispatches Deploy directly
      # instead of trusting that event to arrive.
      - name: Run Test, then Deploy if it passes
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run test.yml --repo "${{ github.repository }}" --ref main

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "${{ github.repository }}" --workflow=test.yml \
              --json databaseId,createdAt,event \
              -q "[.[] | select(.event == \"workflow_dispatch\" and .createdAt > \"$before\")] | .[0].databaseId")"
            [ -n "$run_id" ] && [ "$run_id" != "null" ] && break
            sleep 2
          done
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "Could not find the dispatched Test run" >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
